<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14547A">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-title" content="226 Villa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
<title>Vận hành 226 Villa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Marcellus&display=swap">
<style>
/* Bố cục: một cột, thanh tab dưới cùng cho ngón cái, phiếu (sheet) trượt từ dưới lên; trên máy tính khung giữa 960px. */
:root{
  /* bảng màu 226 Villa (skill nhân bản chuỗi, chốt 18/7/2026): navy #14547A chủ đạo, vàng đồng #C89A46 nhấn, nền #EEF3F6, chữ #222222 */
  --brand:#14547A; --brand-ink:#0d3d5a; --brand-soft:#e1ecf3; --gold:#C89A46; --gold-ink:#8a6420; --gold-soft:#f6eedd;
  --bg:#EEF3F6; --card:#ffffff; --fg:#222222; --muted:#56687a; --line:#d3dee6; --line-2:#e8eff4; --logo-bg:transparent;
  --brandfont:"Marcellus","Be Vietnam Pro",Georgia,serif;
  /* trạng thái: xanh lá = sạch, xong · cam = chờ dọn, chờ duyệt, giữ chỗ · xanh dương = đang làm, đang dọn, đã cọc · tím = có khách, đang ở · đỏ = quá hạn, bảo trì · xám = mới, đã trả */
  --ok:#15803D; --ok-soft:#DCFCE7; --warn:#C2680A; --warn-soft:#FEF0D7; --info:#1D4ED8; --info-soft:#DBEAFE;
  --busy:#6D28D9; --busy-soft:#EDE9FE; --bad:#C81E1E; --bad-soft:#FEE2E2; --grey-soft:#e9edf0;
  /* màu đặc cho nhãn chữ trắng, giữ nguyên ở cả hai chế độ */
  --s-ok:#15803D; --s-warn:#B45309; --s-info:#1D4ED8; --s-busy:#6D28D9; --s-bad:#B91C1C; --s-slate:#475569;
  /* 13 bộ phận, mỗi bộ phận một màu */
  --bp-giam-doc:#14547A; --bp-kinh-doanh:#B7791F; --bp-don-tiep:#DB2777; --bp-buong-phong:#2563EB; --bp-set-up:#7C3AED;
  --bp-bao-tri:#EA580C; --bp-ho-boi:#0891B2; --bp-an-ninh:#334155; --bp-dich-vu:#C026D3; --bp-kho:#92400E;
  --bp-ke-toan:#15803D; --bp-phat-trien:#4D7C0F; --bp-nhan-su:#4F46E5; --bp-khac:#64748B;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --sh:0 1px 2px rgba(20,40,60,.06),0 6px 20px rgba(20,40,60,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#5aa3cf; --brand-ink:#9fcbe6; --brand-soft:#15303f; --gold:#d8b06a; --gold-ink:#e6c78f; --gold-soft:#3a3120; --logo-bg:#EEF3F6;
  --bg:#0d1820; --card:#152530; --fg:#e6edf2; --muted:#9aacb9; --line:#2a3842; --line-2:#1f2b33;
  --ok:#4ADE80; --ok-soft:#12321f; --warn:#FBBF24; --warn-soft:#3a2a0c; --info:#60A5FA; --info-soft:#13264a;
  --busy:#A78BFA; --busy-soft:#2a1f4a; --bad:#F87171; --bad-soft:#3d1717; --grey-soft:#243039;
  --bp-giam-doc:#3B8FC4; --bp-an-ninh:#64748B; --bp-kho:#B45309; --bp-phat-trien:#65A30D;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#5aa3cf; --brand-ink:#9fcbe6; --brand-soft:#15303f; --gold:#d8b06a; --gold-ink:#e6c78f; --gold-soft:#3a3120; --logo-bg:#EEF3F6;
  --bg:#0d1820; --card:#152530; --fg:#e6edf2; --muted:#9aacb9; --line:#2a3842; --line-2:#1f2b33;
  --ok:#4ADE80; --ok-soft:#12321f; --warn:#FBBF24; --warn-soft:#3a2a0c; --info:#60A5FA; --info-soft:#13264a;
  --busy:#A78BFA; --busy-soft:#2a1f4a; --bad:#F87171; --bad-soft:#3d1717; --grey-soft:#243039;
  --bp-giam-doc:#3B8FC4; --bp-an-ninh:#64748B; --bp-kho:#B45309; --bp-phat-trien:#65A30D;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
body.locked>:not(#gate){display:none}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
textarea{resize:vertical;min-height:80px}
label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:10px}
label.f>span{display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;font-size:11px}
label.cb{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg);margin-bottom:10px}
label.cb input{width:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.grow{flex:1 1 160px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}

#gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg)}
#gate .box{max-width:420px;width:100%;background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:28px 24px;text-align:center}
#gate .logo{display:block;width:200px;max-width:70%;height:auto;margin:0 auto;background:var(--logo-bg);border-radius:14px;padding:6px}
#gate h1{font-size:19px;margin-top:10px}
#gate .rule{height:1px;background:var(--gold);width:60px;margin:12px auto 0;opacity:.8}
#gate p{color:var(--muted);font-size:14px}

.top{position:relative;z-index:5;background:var(--card);border-bottom:2px solid var(--gold)}
.top .in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top .emb{height:38px;width:auto;flex:none;display:block;background:var(--logo-bg);border-radius:8px;padding:1px 3px}
.top .ttl .wm{display:block;font-family:var(--brandfont);font-size:11px;letter-spacing:.16em;color:var(--gold-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.top .ttl .wm i{font-style:normal;color:var(--brand)}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:12px;color:var(--muted);text-align:right;max-width:46%;line-height:1.35}
.who b{display:block;color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{max-width:960px;margin:0 auto;}
body.wide main{max-width:1440px}
main{padding:14px 16px calc(84px + env(safe-area-inset-bottom,0px))}
section[hidden]{display:none}
.banner{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:var(--r);padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 0 8px}
.sec-h:first-child{margin-top:0}
.sec-h small{color:var(--muted);font-size:12.5px}
.sec-h>h2{padding-left:10px;border-left:3px solid var(--gold);line-height:1.2}
.empty{color:var(--muted);text-align:center;padding:22px 14px;font-size:14px;border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}

.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.confirming{background:var(--warn);border-color:var(--warn);color:#fff}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--gold);color:#1b1b1b;border:0;border-radius:999px;padding:12px 18px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.2)}
@media(min-width:960px){.fab{right:calc(50% - 480px + 16px)}}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--grey-soft);color:var(--muted)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.sach,.chip.xong,.chip.chot{background:var(--s-ok);color:#fff}
.chip.ban,.chip.cho-duyet,.chip.dam-phan,.chip.bk-giu{background:var(--s-warn);color:#fff}
.chip.dang-don,.chip.dang-lam,.chip.khao-sat,.chip.phuong-an,.chip.bk-coc{background:var(--s-info);color:#fff}
.chip.co-khach,.chip.phap-ly,.chip.bk-o{background:var(--s-busy);color:#fff}
.chip.moi{background:var(--s-slate);color:#fff}
.chip.bk-tra{background:#16A34A;color:#fff}
.chip.bao-tri,.chip.quahan,.chip.bo{background:var(--s-bad);color:#fff}
.chip.huy{background:var(--grey-soft);color:var(--muted)}
.chip.huy{text-decoration:line-through}
.chip.plain::before{display:none}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:600;background:var(--brand-soft);color:var(--brand);white-space:nowrap}

.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.vcard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;border-top:4px solid var(--brand);cursor:pointer}
.vcard.co-khach{border-top-color:var(--busy)}.vcard.cho-don{border-top-color:var(--warn)}.vcard.san-sang{border-top-color:var(--ok)}
.vcard h3{display:flex;justify-content:space-between;gap:8px;align-items:center}
.vcard .addr{font-size:12.5px;color:var(--muted);margin-top:2px}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 8px}
.dot{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;background:var(--muted)}
.dot.sach{background:var(--ok)}.dot.ban{background:var(--warn)}.dot.dang-don{background:var(--info)}.dot.co-khach{background:var(--busy)}.dot.bao-tri{background:var(--bad)}
.dot.chung{border-radius:50%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stats.c4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--bg);border-radius:9px;padding:7px 9px}
.stat b{display:block;font-size:19px;font-weight:600;line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.hot b{color:var(--bad)}.stat.att b{color:var(--warn)}

.bpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bpc{background:var(--card);border-radius:10px;box-shadow:var(--sh);padding:9px 11px;cursor:pointer;display:flex;flex-direction:column;gap:3px;border-left:4px solid var(--brand)}
.bpc b{font-size:13px;font-weight:600;line-height:1.25}
.bpc .n{font-size:12px;color:var(--muted);display:flex;gap:8px}
.bpc .n i{font-style:normal;font-weight:600}
.bpc .n i.w{color:var(--warn)}.bpc .n i.h{color:var(--bad)}
.bpc.quiet{opacity:.75}
.bpc{border-left-color:var(--bpc)}
.bpc b{color:var(--bpc)}
.card.bpcard{border-left:6px solid var(--bpc)}
.card.bpcard h3{color:var(--bpc)}
.bpf{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.bpf button{flex:none;border:2px solid var(--bpc);background:var(--card);color:var(--bpc);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
.bpf button.on{background:var(--bpc);color:#fff}
.bpf button.all{--bpc:var(--brand)}

.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.seg button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.room{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px 12px 10px;border-left:5px solid var(--muted);cursor:pointer;min-height:92px;display:flex;flex-direction:column;gap:4px}
.room{border-left-width:6px}
.room.sach{background:var(--ok-soft)}.room.ban{background:var(--warn-soft)}.room.dang-don{background:var(--info-soft)}.room.co-khach{background:var(--busy-soft)}.room.bao-tri{background:var(--bad-soft)}
.room.sach{border-left-color:var(--ok)}.room.ban{border-left-color:var(--warn)}.room.dang-don{border-left-color:var(--info)}.room.co-khach{border-left-color:var(--busy)}.room.bao-tri{border-left-color:var(--bad)}
.room b{font-size:15px;font-weight:600}
.room .k{font-size:11.5px;color:var(--muted)}
.room .t{margin-top:auto;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select{width:auto;flex:1 1 120px;padding:8px 10px}
.task{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin-bottom:10px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.task{border-left:6px solid var(--bpc,var(--muted))}
.task.cho-duyet{background:var(--warn-soft)}
.task.quahan{background:var(--bad-soft);box-shadow:var(--sh),inset 0 0 0 2px var(--bad)}
.task.xong,.task.huy{opacity:.72}
.tag.bp{background:var(--bpc);color:#fff}
.uu.cao{background:var(--s-bad);color:#fff;padding:1px 7px;border-radius:6px}
.task .late{background:var(--s-bad);color:#fff;padding:1px 7px;border-radius:6px;font-weight:600}
.task .ti{font-weight:600;grid-column:1}
.task .me{grid-column:1;font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.task .ri{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--muted);text-align:right}
.task .pg{height:4px;border-radius:2px;background:var(--line-2);grid-column:1/3;margin-top:6px;overflow:hidden}
.task .pg i{display:block;height:100%;background:var(--bpc,var(--info))}
.task.xong .pg i{background:var(--ok)}
.uu{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.uu.cao{color:#fff}
.late{color:var(--bad);font-weight:600}

.ck{list-style:none;margin:0;padding:0}
.ck li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.ck li:last-child{border-bottom:0}
.ck .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;background:var(--card);margin-top:1px;cursor:pointer}
.ck li.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.ck li.done span{color:var(--muted);text-decoration:line-through}
.ck .box svg{width:14px;height:14px;display:none}
.ck li.done .box svg{display:block}
.ck.ro .box{cursor:default}
.ck.pick li.done span{color:var(--fg);text-decoration:none}

.staff{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer}
.av{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.staff .in{flex:1;min-width:0}
.staff .in b{display:block;font-weight:600}
.staff .in span{font-size:12.5px;color:var(--muted)}
.staff .st{display:flex;gap:10px;font-size:12px;color:var(--muted);text-align:center}
.staff .st b{display:block;font-size:16px;color:var(--fg);font-weight:600}

.hist{list-style:none;margin:0;padding:0;font-size:13px}
.hist li{display:grid;grid-template-columns:92px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line-2)}
.hist li:last-child{border-bottom:0}
.hist time{color:var(--muted);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:8px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.nk{list-style:none;margin:0;padding:0}
.nk li{padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13.5px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.nk li:last-child{border-bottom:0}
.nk .m{font-size:12px;color:var(--muted);white-space:nowrap}
.nk .m b{display:block;color:var(--fg)}
.nk .nd{overflow-wrap:anywhere}
.nk .tag{margin-right:4px}

.mb{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin-bottom:10px;cursor:pointer}
.mb b{display:block;font-weight:600}
.mb .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.mb .r{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center;font-size:12.5px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .in{max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{background:none;border:0;padding:6px 2px;font-size:11px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--brand)}
.tabbar button.on::after{content:"";position:absolute;top:-6px;left:30%;right:30%;height:2px;background:var(--gold);border-radius:2px}
.tabbar .bd{position:absolute;top:2px;right:calc(50% - 20px);background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:17px;height:17px;line-height:17px;padding:0 4px;text-align:center}

.scrim{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:calc(100% - 40px - env(safe-area-inset-top,0px));overflow:auto;border-radius:18px 18px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 30px rgba(0,0,0,.2)}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px;max-height:88vh}}
.sheet .hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.sheet .hd h2{font-size:18px}
.sheet .x{border:0;background:var(--grey-soft);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;flex:none}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sheet .acts .btn{flex:1 1 140px;justify-content:center}
.stbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0}
.stbtns button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:6px;justify-content:center}
.stbtns button.on{outline:2px solid var(--brand);outline-offset:-1px}
.stbtns button i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tpl{display:flex;flex-wrap:wrap;gap:6px}
.tpl button{border:1px solid var(--bpc,var(--line));background:var(--bg);color:var(--bpc,var(--fg));border-radius:999px;padding:6px 11px;font-size:13px;font-weight:500}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.photos .ph{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;background:var(--grey-soft);cursor:pointer;flex:none}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph .del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:22px;height:22px;font-size:12px;line-height:22px;padding:0}
.photos .add{width:88px;height:88px;border:2px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;color:var(--muted);cursor:pointer;background:var(--card);text-align:center;padding:4px}
.photos .add svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.photos .add input{display:none}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.lb .cap{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;font-size:13px}
.calw{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.cal{display:grid;grid-template-columns:118px minmax(0,1fr);gap:6px 6px;align-items:center;font-size:12.5px;width:100%}
.cal .vn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;background:var(--card);z-index:3;padding-right:6px;width:118px;color:var(--brand)}
.cal .vn small{display:block;font-weight:500;color:var(--muted);font-size:11px;line-height:1.3}
.cal .vn small b{color:var(--fg);font-weight:700}
.cal .days{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(22px,1fr);gap:3px}
/* ô trống: trắng có viền mảnh; cuối tuần trống: be nhạt */
.cal .d{height:36px;border-radius:6px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);position:relative;cursor:pointer}
.cal .d.we{background:color-mix(in srgb,var(--gold) 16%,var(--card))}
/* ô có khách: màu đặc, nối liền thành thanh */
.cal .d.bkd{border-radius:0;width:calc(100% + 3px);box-shadow:none}
.cal .d.bkd.s{border-top-left-radius:9px;border-bottom-left-radius:9px}
.cal .d.bkd.e{border-top-right-radius:9px;border-bottom-right-radius:9px;width:100%}
.cal .d.bk-tra{background:#16A34A}
.cal .d.bk-coc{background:#1D4ED8}
.cal .d.bk-o{background:#7C3AED}
.cal .d.bk-giu{background:repeating-linear-gradient(135deg,#D97706 0 6px,#F59E0B 6px 12px)}
.cal .d.bkd.we{box-shadow:inset 0 0 0 40px rgba(0,0,0,.12)}
.cal .d.bkd.today{box-shadow:inset 0 0 0 3px var(--gold)}
.cal .d .bkl{position:absolute;left:4px;top:50%;transform:translateY(-50%);color:#fff;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:clip;z-index:2;pointer-events:none;letter-spacing:-.02em;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.cal .d.today{box-shadow:inset 0 0 0 3px var(--gold),0 0 0 1px var(--gold)}
.cal .hd{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.15}
.cal .hd b{display:block;font-size:12px;color:var(--fg)}
.cal .hd.we{color:var(--gold-ink)}.cal .hd.we b{color:var(--gold-ink)}
.cal .hd.today{background:var(--gold);border-radius:6px;color:#fff}.cal .hd.today b{color:#fff}
.legend.big{gap:14px;font-size:12.5px;color:var(--fg)}
.legend.big i{width:18px;height:12px;border-radius:4px;vertical-align:-2px}
.mnav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mnav h3{flex:1;text-align:center;font-size:15px}
.mnav .btn{padding:6px 12px}
.bk{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:11px 14px;margin-bottom:8px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center}
.bk{border-left:6px solid var(--s-info)}.bk.bk-giu{border-left-color:var(--s-warn)}.bk.bk-o{border-left-color:var(--s-busy)}.bk.bk-tra{border-left-color:#16A34A}
.bk .dt{font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.bk .dt small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.bk .in b{display:block;font-weight:600}
.bk .in span{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:30;box-shadow:var(--sh);max-width:92vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<style>
body.cdt .tabbar button[data-tab=nhanvien]{display:none}
#who b::after{content:" ▾";font-size:10px;color:var(--muted)}
body.cdt #tab-bophan .seg{display:none}
body.cdt #fab{display:none!important}
.cdt-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer}
.cdt-card .in{flex:1;min-width:0}
.cdt-card .in b{display:block;font-weight:600}
.cdt-card .in span{font-size:12.5px;color:var(--muted)}
</style>
</head>

<script>
/* ---------- Firebase: đăng nhập và kho dữ liệu ----------
   Thay cho window.claude của claude.ai. App gọi window.claude.use("db") và use("user") y như cũ:
   "db" trả về Firestore (cùng kiểu collection/doc/onSnapshot/get/set/update/delete),
   "user" trả về các hàm id, canEdit, can, isOwner, profiles.
   Ai được vào: email chủ trong FB_OWNERS, hoặc email có trong members/<email> (quản lý ghi khi lưu hồ sơ nhân viên).
   Quy tắc firestore.rules chặn ở phía máy chủ, phần này chỉ để hiện màn hình cho đúng. */
(function(){
const CFG=window.FB_CONFIG||{};
const OWNERS=(window.FB_OWNERS||[]).map(e=>String(e).trim().toLowerCase()).filter(Boolean);
const lc=e=>String(e||"").trim().toLowerCase();
/* tài khoản không cần email thật: tên đăng nhập + "@nv.villa226.com" (tên miền không nhận thư), do giám đốc, quản lý tạo sẵn */
const DN_MIEN="nv.villa226.com";
const laTenDn=e=>lc(e).endsWith("@"+DN_MIEN);
const dnEmail=v=>{v=lc(v);if(!v)return"";if(v.includes("@"))return v;const t=v.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/[^a-z0-9._-]/g,"");return t?t+"@"+DN_MIEN:""};
const $g=()=>document.getElementById("gateMsg");
const show=h=>{const g=$g();if(g)g.innerHTML=h};
const escH=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
window.FB_CODE=c=>({"permission-denied":"invalid_argument","resource-exhausted":"quota_exceeded","unauthenticated":"revoked"}[c]||c);

if(!CFG.apiKey||!window.firebase){
  window.claude={use:()=>{show('<p><b>App chưa kết nối Firebase.</b></p><p>Cần điền thông tin dự án Firebase vào file <code>firebase-config.js</code>.</p>');return new Promise(()=>{})}};
  return;
}
firebase.initializeApp(CFG);
const auth=firebase.auth();
const fs=firebase.firestore();
auth.languageCode="vi";
const emu=CFG.emulator&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
if(emu){auth.useEmulator("http://127.0.0.1:9099",{disableWarnings:true});fs.useEmulator("127.0.0.1",8080)}
fs.settings({ignoreUndefinedProperties:true,merge:true});
if(!emu)fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});

const LOI={"auth/invalid-credential":"Sai email, tên đăng nhập hoặc mật khẩu.","auth/wrong-password":"Sai email, tên đăng nhập hoặc mật khẩu.","auth/user-not-found":"Chưa có tài khoản này. Email thì bấm \"Tạo mật khẩu lần đầu\", tên đăng nhập thì nhờ giám đốc tạo.","auth/invalid-email":"Email chưa đúng.","auth/missing-password":"Chưa nhập mật khẩu.","auth/weak-password":"Mật khẩu cần ít nhất 6 ký tự.","auth/email-already-in-use":"Email này đã có mật khẩu. Bấm Đăng nhập, quên thì bấm Quên mật khẩu.","auth/too-many-requests":"Thử sai nhiều lần, đợi vài phút rồi thử lại.","auth/network-request-failed":"Mất mạng, kiểm tra kết nối rồi thử lại.","auth/operation-not-allowed":"Cách đăng nhập này chưa được bật trong Firebase.","auth/unauthorized-domain":"Tên miền này chưa được thêm vào Firebase (Authentication, Settings, Authorized domains).","auth/popup-blocked":"Trình duyệt chặn cửa sổ đăng nhập.","auth/user-disabled":"Tài khoản này đã bị khóa."};
const loiMsg=e=>LOI[e&&e.code]||("Chưa đăng nhập được"+(e&&e.code?" ("+e.code+")":"")+".");

let resolved=false,resolveReady;
const ready=new Promise(r=>resolveReady=r);
let USER=null;

function loginForm(note){
  show('<p>Đăng nhập để vào app.</p>'+
  '<button class="btn p" id="fbGoogle" style="width:100%;justify-content:center;margin:8px 0 14px">Đăng nhập bằng Google</button>'+
  '<div class="small muted" style="margin-bottom:8px">hoặc dùng email (hay tên đăng nhập do giám đốc cấp) và mật khẩu</div>'+

  '<label class="f"><span>Mật khẩu</span><input id="fbPass" type="password" autocomplete="current-password" minlength="6"></label>'+
  '<div class="row" style="justify-content:center"><button class="btn p" type="submit">Đăng nhập</button><button class="btn" type="button" id="fbNew">Tạo mật khẩu lần đầu</button></div>'+

  document.getElementById("fbGoogle").onclick=async()=>{note$(null);const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
    try{await auth.signInWithPopup(p)}catch(e){if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"){try{await auth.signInWithRedirect(p)}catch(e2){note$({m:loiMsg(e2)})}}else if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request")note$({m:loiMsg(e)})}};
  document.getElementById("fbForm").onsubmit=async ev=>{ev.preventDefault();note$(null);try{await auth.signInWithEmailAndPassword(em(),pw())}catch(e){note$({m:loiMsg(e)})}};
  document.getElementById("fbNew").onclick=async()=>{note$(null);if(!em())return note$({m:"Nhập email trước."});if(!raw().includes("@"))return note$({m:"Tên đăng nhập do giám đốc cấp sẵn, bạn chỉ cần đăng nhập. Chưa có thì nhờ giám đốc tạo."});if(pw().length<6)return note$({m:"Đặt mật khẩu ít nhất 6 ký tự rồi bấm lại."});
    try{const c=await auth.createUserWithEmailAndPassword(em(),pw());await c.user.sendEmailVerification()}catch(e){note$({m:loiMsg(e)})}};
  document.getElementById("fbQuen").onclick=async()=>{if(!em())return note$({m:"Nhập email rồi bấm Quên mật khẩu."});if(!raw().includes("@"))return note$({m:"Tên đăng nhập không có thư đặt lại. Nhờ giám đốc đặt lại mật khẩu cho bạn."});
    try{await auth.sendPasswordResetEmail(em());note$({ok:1,m:"Đã gửi thư đặt lại mật khẩu tới "+em()+". Mở thư, đặt mật khẩu mới rồi quay lại đây."})}catch(e){note$({m:loiMsg(e)})}};
}
function verifyForm(u){
  show('<p><b>Xác nhận email</b></p><p>Đã gửi thư xác nhận tới <b>'+escH(u.email)+'</b>. Mở thư, bấm vào đường link, rồi quay lại bấm nút dưới. Không thấy thư thì xem mục Spam hoặc Quảng cáo.</p>'+
  '<div class="row" style="justify-content:center"><button class="btn p" id="fbDaXn">Tôi đã xác nhận</button><button class="btn" id="fbGuiLai">Gửi lại thư</button><button class="btn" id="fbOut">Đổi tài khoản</button></div><p id="fbNote" class="small"></p>');
  document.getElementById("fbDaXn").onclick=async()=>{await u.reload();await u.getIdToken(true);if(auth.currentUser&&auth.currentUser.emailVerified)afterLogin(auth.currentUser);else document.getElementById("fbNote").textContent="Chưa thấy xác nhận. Bấm link trong thư trước đã."};
  document.getElementById("fbGuiLai").onclick=async()=>{try{await u.sendEmailVerification();document.getElementById("fbNote").textContent="Đã gửi lại."}catch(e){document.getElementById("fbNote").textContent=loiMsg(e)}};
  document.getElementById("fbOut").onclick=()=>auth.signOut();
}
function deniedForm(u){
  show('<p><b>Email '+escH(u.email)+' chưa được cấp quyền vào app.</b></p><p>Nhờ quản lý mở tab Nhân viên, sửa hồ sơ của bạn, điền đúng email này vào ô "Email đăng nhập" rồi lưu. Sau đó bấm Thử lại.</p>'+
  '<div class="row" style="justify-content:center"><button class="btn p" id="fbLai">Thử lại</button><button class="btn" id="fbOut">Đổi tài khoản</button></div>');
  document.getElementById("fbLai").onclick=()=>afterLogin(u);
  document.getElementById("fbOut").onclick=()=>auth.signOut();
}
async function memberOf(u){
  const email=lc(u.email);
  if(OWNERS.includes(email))return{owner:true,quanLy:true,email};
  try{const d=await fs.doc("members/"+email).get();if(d.exists)return{...d.data(),email}}catch(e){}
  return null;
}
async function afterLogin(u){
  if(resolved)return;
  show('<p>Đang mở kho dữ liệu…</p>');
  const m=await memberOf(u);
  if(!m){deniedForm(u);return}
  const id="u_"+u.uid;
  const ten=u.displayName||lc(u.email).split("@")[0];
  try{await fs.doc("users/"+id).set({ten,email:lc(u.email),lanCuoi:new Date().toISOString()},{merge:true})}catch(e){}
  USER={
    id:async()=>id,
    canEdit:async()=>!!(m.owner||m.quanLy),
    can:async()=>true,
    isOwner:async()=>!!m.owner,
    profiles:async ids=>{const o={};await Promise.all(ids.map(async i=>{try{const d=await fs.doc("users/"+i).get();if(d.exists)o[i]={name:d.data().ten||""}}catch(e){}}));return o}
  };
  window.FB={fs,auth,firebase,member:m,email:lc(u.email),ten,owners:OWNERS,signOut:()=>auth.signOut(),laTenDn,dnEmail,DN_MIEN,
    /* giám đốc, quản lý tạo tài khoản tên đăng nhập: dùng app phụ để không bị đăng xuất */
    taoTaiKhoan:async(email,pw)=>{const app=firebase.initializeApp(CFG,"phu"+Date.now());try{const a=app.auth();if(emu)a.useEmulator("http://127.0.0.1:9099",{disableWarnings:true});await a.createUserWithEmailAndPassword(email,pw);await a.signOut()}finally{try{await app.delete()}catch(e){}}},
    doiMatKhau:async(cu,moi)=>{const u=auth.currentUser;await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,cu));await u.updatePassword(moi)}};
  resolved=true;resolveReady();
}
auth.getRedirectResult().catch(e=>loginForm(loiMsg(e)));
auth.onAuthStateChanged(u=>{
  if(resolved){if(!u||"u_"+u.uid!==window.FB_UID_LAST)location.reload();return}
  if(!u){loginForm();return}
  window.FB_UID_LAST="u_"+u.uid;
  const google=(u.providerData||[]).some(p=>p.providerId==="google.com");
  if(!u.emailVerified&&!google&&!laTenDn(u.email)){verifyForm(u);return}
  afterLogin(u);
});
window.claude={use:async name=>{await ready;if(name==="db")return fs;if(name==="user")return USER;return null}};
})();
</script>

function taoViecDatPhong(){

  for(const b of BOOKINGS){if(!bkActive(b)||GEN.has("bk@"+b.id+"@"+key))continue;const v=VILLAS.find(x=>x.id===b.villa);if(!v)continue;

function compressImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{URL.revokeObjectURL(url);const MAX=800;let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,MAX/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);let q=0.7,out=c.toDataURL("image/jpeg",q);while(out.length>180*1024&&q>0.3){q-=0.1;out=c.toDataURL("image/jpeg",q)}if(out.length>240*1024){const c2=document.createElement("canvas");c2.width=Math.round(w*0.7);c2.height=Math.round(h*0.7);c2.getContext("2d").drawImage(im,0,0,c2.width,c2.height);out=c2.toDataURL("image/jpeg",0.5)}res(out)};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("Không đọc được ảnh"))};im.src=url})}

function staffStats(sid){
  const m=new Date();m.setDate(1);m.setHours(0,0,0,0);const since=m.toISOString();
  const done=TASKS.filter(t=>t.giaoCho===sid&&t.trangThai==="xong"&&(t.duyetLuc||t.tao||"")>=since);
  const first=done.filter(t=>!t.soLanTraLai).length;const open=TASKS.filter(t=>t.giaoCho===sid&&isOpen(t)).length;
  const onTime=done.filter(t=>!t.hanXong||(t.baoXong&&t.baoXong<=t.hanXong)).length;
  let tot=0,n=0;for(const t of done){if(t.batDau&&t.baoXong){tot+=new Date(t.baoXong)-new Date(t.batDau);n++}}
  return{done:done.length,first,pct:done.length?Math.round(first/done.length*100):null,onTime:done.length?Math.round(onTime/done.length*100):null,open,avgMin:n?Math.round(tot/n/60000):null}}

/* ---------- Chủ đầu tư: tài khoản chỉ xem villa của mình ---------- */
const laCdt = () => !!(window.FB && FB.member && FB.member.chuDauTu);
let CDT = [], cdtDaNghe = false;
/* ảnh chứng minh: chủ đầu tư phải hỏi kèm villa thì quy tắc máy chủ mới cho đọc */
function fbAnhQuery(taskId) {

/* chủ đầu tư đăng nhập: không nghe cả kho mà nghe riêng từng villa của mình (quy tắc firestore.rules chặn phần còn lại) */
function fbChuDauTuBoot() {
  canWrite = false; canWriteKnown = true; isAdmin = false;
  document.body.classList.add("cdt");
  bpSeg = "datphong";
  if (tab === "nhanvien") tab = "tong";
  const bt = document.querySelector('.tabbar button[data-tab="bophan"]');

  const phan = {};

  const docs = (s) => s.docs.map((d) => ({ id: d.id, ...d.data() }));
  const thuTu = (a, b) => (a.thuTu || 99) - (b.thuTu || 99);
  const loi = (c, e) => { console.error(c, e); if (e && e.code === "permission-denied") toast("Chưa được cấp quyền xem " + c); };
  const mergeBk = () => { const ids = new Set(BK_REAL.map((b) => b.id)); BOOKINGS = BK_REAL.concat(BK_LUU.filter((b) => !ids.has(b.id))).sort((a, b) => String(a.nhan || "").localeCompare(String(b.nhan || ""))); };
  for (const v of vs) {
    db.doc("villas/" + v).onSnapshot((d) => { dat("villas", v, d.exists ? [{ id: d.id, ...d.data() }] : []); VILLAS = gop("villas").sort(thuTu); render(); }, (e) => loi("villa", e));
    const nghe = (col, xuLy) => db.collection(col).where("villa", "==", v).onSnapshot((s) => { dat(col, v, docs(s)); xuLy(); render(); }, (e) => loi(col, e));
    nghe("rooms", () => { ROOMS = gop("rooms").sort(thuTu); });
    nghe("tasks", () => { TASKS = gop("tasks").sort((a, b) => String(b.tao || "").localeCompare(String(a.tao || ""))); });

    nghe("nhatky", () => { NHATKY = gop("nhatky").sort((a, b) => String(b.ngay || "").localeCompare(String(a.ngay || ""))).slice(0, 90); });
  }

/* ---------- Thông báo đẩy (Web Push): bật trên từng máy, token lưu ở pushTokens/<mã tài khoản> ---------- */
const fbDayOk = () => !!(self.FB_VAPID && window.FB && "serviceWorker" in navigator && "Notification" in window && "PushManager" in window && firebase.messaging && firebase.messaging.isSupported && firebase.messaging.isSupported());
const fbLaIos = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const fbDaCaiDat = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const fbTokenMay = () => { try { return localStorage.getItem("bp226-push") || ""; } catch (e) { return ""; } };
let fbDayNgheTrongApp = false;
function fbKhoiDongThongBao() {
  /* app đang mở: thông báo đến thì hiện toast, khỏi nhảy thông báo hệ thống */
  if (fbDayNgheTrongApp || laCdt() || !fbDayOk() || Notification.permission !== "granted" || !fbTokenMay()) return;
  try { firebase.messaging().onMessage((p) => { toast((p.notification && p.notification.title) || "Có cập nhật việc"); }); fbDayNgheTrongApp = true; } catch (e) { console.error("thông báo", e); }
}
async function fbBatThongBao() {
  if (!fbDayOk()) throw new Error("Trình duyệt này chưa hỗ trợ thông báo.");
  if (fbLaIos() && !fbDaCaiDat()) throw new Error("Trên iPhone: bấm nút Chia sẻ của Safari, chọn Thêm vào Màn hình chính, mở app từ biểu tượng đó rồi bật lại.");
  const quyen = await Notification.requestPermission();
  if (quyen !== "granted") throw new Error("Anh/chị chưa cho phép thông báo. Vào cài đặt trình duyệt hoặc điện thoại, bật cho villa226.com rồi thử lại.");
  const reg = await navigator.serviceWorker.register("firebase-messaging-sw.js");
  await navigator.serviceWorker.ready;
  const token = await firebase.messaging().getToken({ vapidKey: self.FB_VAPID, serviceWorkerRegistration: reg });
  if (!token) throw new Error("Chưa lấy được mã thông báo, thử lại sau.");
  await db.doc("pushTokens/" + uid).set({ tokens: firebase.firestore.FieldValue.arrayUnion(token), email: FB.email, capNhat: now() }, { merge: true });
  try { localStorage.setItem("bp226-push", token); } catch (e) { /* bỏ qua */ }
  fbKhoiDongThongBao();
}
async function fbTatThongBao() {
  const token = fbTokenMay();
  try { await firebase.messaging().deleteToken(); } catch (e) { /* bỏ qua */ }
  if (token) { try { await db.doc("pushTokens/" + uid).update({ tokens: firebase.firestore.FieldValue.arrayRemove(token) }); } catch (e) { /* bỏ qua */ } }
  try { localStorage.removeItem("bp226-push"); } catch (e) { /* bỏ qua */ }
}
function fbPhanThongBao() {
  if (laCdt() || !self.FB_VAPID) return "";
  const bat = fbDayOk() && Notification.permission === "granted" && !!fbTokenMay();
  let h = '<div class="sec-h"><h3>Thông báo việc</h3></div>';
  if (!fbDayOk()) h += '<div class="small muted">' + (fbLaIos() && !fbDaCaiDat() ? "Trên iPhone: bấm nút Chia sẻ của Safari, chọn Thêm vào Màn hình chính, mở app từ biểu tượng đó rồi vào đây bật thông báo." : "Trình duyệt này chưa hỗ trợ thông báo.") + "</div>";
  else if (bat) h += '<div class="small" style="margin-bottom:8px">Đã bật trên máy này: có việc giao, đổi hạn, trả lại hoặc sắp tới hạn là máy báo ngay, kể cả khi đóng app.</div><div class="acts"><button class="btn" id="fbTatTb">Tắt thông báo trên máy này</button></div>';
  else h += '<div class="small muted" style="margin-bottom:8px">Bật để máy báo ngay khi có việc giao cho mình, đổi hạn, trả lại hoặc sắp tới hạn, kể cả khi đóng app.</div><div class="acts"><button class="btn p" id="fbBatTb">Bật thông báo trên máy này</button></div>';
  return h;
}
function fbGanNutThongBao() {
  const b = document.getElementById("fbBatTb"), t = document.getElementById("fbTatTb");
  if (b) b.onclick = async () => { b.disabled = true; try { await fbBatThongBao(); toast("Đã bật thông báo"); fbMoTaiKhoan(); } catch (e) { b.disabled = false; toast(e.message || "Chưa bật được thông báo"); console.error(e); } };

/* ---------- Đặt phòng mới: tự giao quản gia việc làm sạch căn trước giờ mở cửa cho khách ---------- */
/* quản gia của căn: nhân viên bộ phận Đón tiếp, quản gia đang hoạt động, phụ trách đúng villa đó (không ghi villa thì coi là phụ trách cả chuỗi, chỉ nhận khi có đúng một người) */
function fbQuanGia(vid) {
  const ds = STAFF.filter((s) => s.hoatDong !== false && bpCuaNguoi(s).includes("don-tiep"));
  const rieng = ds.filter((s) => s.villa === vid);
  if (rieng.length) return rieng[0];
  /* căn chưa có quản gia Đón tiếp riêng: người Buồng phòng phụ trách căn đó (anh Dần chốt 24/10/2026) */
  const canNay = STAFF.find((s) => s.hoatDong !== false && s.villa === vid && bpCuaNguoi(s).includes("buong-phong"));
  if (canNay) return canNay;
  const chung = ds.filter((s) => !s.villa);
  return chung.length === 1 ? chung[0] : null;
}
function fbHanMoCua(b) {
  const hm = String(b.gioNhan || GIO_NHAN).split(":").map(Number);
  const [y, m, d] = String(b.nhan).split("-").map(Number);
  return new Date(y, m - 1, d, hm[0] || 0, hm[1] || 0, 0, 0).toISOString();
}
function fbViecTruocKhach() {

    const t = TASKS.find((x) => x.id === id);
    const v = VILLAS.find((x) => x.id === b.villa);
    const qg = fbQuanGia(b.villa);
    if (t) {
      if (!isOpen(t)) continue;
      const k = "truoc@" + b.id + "@" + b.nhan + "@" + (b.gioNhan || "") + "@" + bkActive(b) + "@" + (qg ? qg.id : "") + "@" + (t.giaoCho || "");
      if (GEN.has(k)) continue; GEN.add(k);
      if (!bkActive(b)) { updDoc("tasks/" + id, { trangThai: "huy", lichSu: hist(t, "Tự hủy vì đặt phòng đã hủy") }); continue; }
      const han = fbHanMoCua(b), d = {}, ghi = [];
      if (t.hanXong !== han) { d.hanXong = han; ghi.push("đổi hạn theo giờ mở cửa mới"); }
      if (!t.giaoCho && qg) { d.giaoCho = qg.id; ghi.push("giao cho " + qg.ten); }
      if (ghi.length) { d.lichSu = hist(t, "Tự cập nhật: " + ghi.join(", ")); updDoc("tasks/" + id, d); }
      continue;
    }
    if (!bkActive(b) || b.nhan < hom || !v) continue;
    const k = "truoc@" + b.id + "@moi"; if (GEN.has(k)) continue; GEN.add(k);

function fbLapHanDate() { const v = (document.getElementById("gHan") || {}).value; const d = v ? new Date(v) : null; return d && !isNaN(d) ? d : null; }
function fbLapGan() {
  const sel = document.getElementById("gLap"); if (!sel) return;
  const g = (i) => document.getElementById(i);
  const hien = (macDinh) => {
    const ck = sel.value, d = fbLapHanDate();
    g("gLapThuW").hidden = ck !== "tuan"; g("gLapNgayW").hidden = ck !== "thang" && ck !== "quy";
    if (macDinh && d) { g("gLapThu").value = String(d.getDay()); g("gLapNgay").value = Math.min(28, d.getDate()); }
    if (!ck) { g("gLapGhi").textContent = ""; return; }
    const l = { chuKy: ck, thu: +g("gLapThu").value, ngay: +g("gLapNgay").value || 1, gio: d ? pad(d.getHours()) + ":" + pad(d.getMinutes()) : "" };
    g("gLapGhi").textContent = "Việc này giao ngay bây giờ. Các lần sau app tự tạo: " + lichMota(l).toLowerCase() + ". Sửa hoặc tắt ở tab Bộ phận, mục Lịch định kỳ.";
  };
  const mauCua = () => {
    const lo = g("gLoai") && g("gLoai").value, bp = g("gBp") && g("gBp").value; if (!lo) return null;
    const ds = LICH.filter((l) => l.loai === lo && (l.boPhan || (LOAI[l.loai] || {}).bp) === bp);
    return ds.find((l) => /^l-/.test(l.id) && l.hoatDong === false) || ds[0] || null;
  };
  const veMau = () => {
    const box = g("gLapMau"); if (!box) return;
    const l = mauCua();
    if (!l || sel.value) { box.innerHTML = ""; return; }
    box.innerHTML = '<div class="small muted" style="margin-bottom:6px">Mẫu việc này thường lặp: ' + esc(lichMota(l)) + '</div><div class="acts" style="margin-bottom:8px"><button type="button" class="btn sm" id="gLapMauBtn">Lặp theo mẫu</button></div>';
    g("gLapMauBtn").onclick = () => {
      sel.value = l.chuKy || "ngay"; hien(true);
      if (l.thu != null && sel.value === "tuan") g("gLapThu").value = String(l.thu);
      if (l.ngay && (sel.value === "thang" || sel.value === "quy")) g("gLapNgay").value = l.ngay;
      if (l.gio) {   // chỉnh giờ hạn theo mẫu, giờ đã qua thì sang ngày mai
        const d = fbLapHanDate() || new Date(), [hh, mm] = l.gio.split(":").map(Number); d.setHours(hh, mm, 0, 0);
        if (d < new Date()) d.setTime(d.getTime() + 86400000);
        g("gHan").value = localInput(d); g("gHan").dispatchEvent(new Event("input"));
      }
      hien(false); veMau();
    };
  };
  sel.addEventListener("change", () => { hien(true); veMau(); });
  for (const i of ["gLapThu", "gLapNgay"]) g(i).addEventListener("change", () => hien(false));
  g("gHan").addEventListener("input", () => hien(false));
  for (const i of ["gLoai", "gBp"]) g(i).addEventListener("change", () => setTimeout(veMau, 0));
  setTimeout(veMau, 0);   // gLoai được điền sau khi form vẽ xong
}

async function fbLsTai() {
  LS_TAI = 1; LS_LOI = ""; fbLsVe();
  try { const s = await db.collection("lichsu").orderBy("luc", "desc").limit(500).get(); LS = s.docs.map((d) => d.data()); }
  catch (e) { console.error(e); LS_LOI = "Chưa đọc được lịch sử. Kiểm tra đã dán quy tắc bảo mật mới chưa."; }
  LS_TAI = 2; fbLsVe();
}
function fbLsKhung() {
  if (!isMgr()) return "";
  return '<div class="card" id="lsCard"><h3>Lịch sử sử dụng</h3><div class="small muted" style="margin:6px 0 10px">Ai làm gì, lúc nào trong app. 500 dòng mới nhất, chỉ giám đốc và quản lý xem được.</div><div id="lsBody"></div></div>';
}
function fbLsGan(el) {
  if (!isMgr() || !el.querySelector("#lsBody")) return;
  if (LS_TAI === 0) fbLsTai(); else fbLsVe();
}
function fbLsVe() {
  const b = document.getElementById("lsBody"); if (!b) return;
  if (LS_TAI === 1) { b.innerHTML = '<div class="small muted">Đang tải…</div>'; return; }
  if (LS_LOI) { b.innerHTML = '<div class="small" style="color:var(--bad)">' + esc(LS_LOI) + '</div><div class="acts"><button class="btn" id="lsLai">Thử lại</button></div>'; b.querySelector("#lsLai").onclick = fbLsTai; return; }
  const ais = [...new Set(LS.map((x) => x.nguoi || x.email).filter(Boolean))].sort();
  const loais = [...new Set(LS.map((x) => x.loai).filter(Boolean))].sort();
  let h = '<div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
    '<select id="lsAi"><option value="">Mọi người</option>' + ais.map((a) => opt(a, a, LS_LOC.ai)).join("") + '</select>' +
    '<select id="lsLoai"><option value="">Mọi loại</option>' + loais.map((a) => opt(a, a, LS_LOC.loai)).join("") + '</select>' +
    '<input type="date" id="lsNgay" value="' + esc(LS_LOC.ngay) + '"><button class="btn sm" id="lsLai">Tải lại</button></div>';
  const ds = LS.filter((x) => (!LS_LOC.ai || (x.nguoi || x.email) === LS_LOC.ai) && (!LS_LOC.loai || x.loai === LS_LOC.loai) && (!LS_LOC.ngay || x.ngay === LS_LOC.ngay));
  if (!ds.length) h += '<div class="empty"><b>Chưa có dòng nào</b>Lịch sử bắt đầu ghi từ lần cập nhật app này.</div>';
  else {
    let ng = "";
    for (const x of ds.slice(0, 200)) {
      if (x.ngay !== ng) { ng = x.ngay; h += '<div class="small muted" style="margin:10px 0 4px"><b>' + esc(fmtNgay(x.ngay) + "/" + String(x.ngay || "").slice(0, 4)) + '</b></div>'; }
      h += '<div style="padding:6px 0;border-top:1px solid rgba(0,0,0,.08)"><div><b>' + esc(x.nguoi || x.email || "?") + '</b> · ' + esc(x.mota || "") + '</div><div class="small muted">' + esc(fmtHM(x.luc)) + (x.loai ? " · " + esc(x.loai) : "") + (x.ten ? " · " + esc(x.ten) : "") + '</div></div>';
    }
    if (ds.length > 200) h += '<div class="small muted" style="margin-top:8px">Còn ' + (ds.length - 200) + ' dòng nữa, lọc theo người hoặc ngày để xem.</div>';
  }
  b.innerHTML = h;
  b.querySelector("#lsAi").onchange = (e) => { LS_LOC.ai = e.target.value; fbLsVe(); };
  b.querySelector("#lsLoai").onchange = (e) => { LS_LOC.loai = e.target.value; fbLsVe(); };
  b.querySelector("#lsNgay").onchange = (e) => { LS_LOC.ngay = e.target.value; fbLsVe(); };
  b.querySelector("#lsLai").onclick = fbLsTai;
}
</script>
</body>
</html>
